# Builds the editor plugin for every supported platform and packages it as one zip.
# - Every push/PR: build all platforms, test them, upload the "godot_git" zip as a workflow artifact.
# - Pushing a tag like v0.3.0: the same, built without any cache, and then a draft release with the
#   zip, SHA256SUMS and signed build attestations. Publishing the draft (by hand) makes it immutable.
# Actions are pinned to commit hashes (the tag in the comment), so what runs can't change underneath.

name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x86_64, os: windows-2025-vs2026, platform: windows, arch: x86_64 }
          - { name: Windows arm64, os: windows-11-vs2026-arm, platform: windows, arch: arm64 }
          # Oldest available Ubuntu, so the library runs on as many distros (glibc versions) as possible.
          - { name: Linux x86_64, os: ubuntu-22.04, platform: linux, arch: x86_64 }
          - { name: Linux arm64, os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { name: macOS universal, os: macos-26, platform: macos, arch: universal }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons

      # Baked into the library (the ⋮ menu shows it) and used for the zip's name.
      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          echo "GODOT_GIT_VERSION=$version" >> "$GITHUB_ENV"

      # Cache key follows the submodule commits and the libgit2 build script, so bumping
      # libgit2/godot-cpp or changing its build options starts from a clean cache.
      # Releases are built from scratch: nothing from an earlier run goes into a release.
      - name: Compute cache key
        if: github.ref_type != 'tag'
        id: cache-key
        shell: bash
        run: echo "deps=$(git submodule status | sha1sum | cut -c1-12)-${{ hashFiles('tools/libgit2.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .scons-cache
            build/libgit2
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.cache-key.outputs.deps }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.cache-key.outputs.deps }}-

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.ref_type != 'tag' && format('{0}/.scons-cache', github.workspace) || '' }}
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=editor -j4

      - name: Upload library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            project/addons/godot_git/bin/
            !project/addons/godot_git/bin/**/*.lib
            !project/addons/godot_git/bin/**/*.exp
            !project/addons/godot_git/bin/**/*.pdb
          if-no-files-found: error

  # Runs project/tests (the GitRepository suites) with the official Godot, headless, against each
  # platform's freshly built library, then the smoke test of the dock (tools/smoke) in a headless
  # editor. The suites never create the dock; the smoke test catches it crashing the editor.
  test:
    name: Test ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x86_64, os: windows-2025-vs2026, platform: windows, arch: x86_64, godot_zip: win64.exe.zip, godot_bin: Godot_v4.7.2-stable_win64_console.exe }
          - { name: Windows arm64, os: windows-11-vs2026-arm, platform: windows, arch: arm64, godot_zip: windows_arm64.exe.zip, godot_bin: Godot_v4.7.2-stable_windows_arm64_console.exe }
          - { name: Linux x86_64, os: ubuntu-22.04, platform: linux, arch: x86_64, godot_zip: linux.x86_64.zip, godot_bin: Godot_v4.7.2-stable_linux.x86_64 }
          - { name: Linux arm64, os: ubuntu-22.04-arm, platform: linux, arch: arm64, godot_zip: linux.arm64.zip, godot_bin: Godot_v4.7.2-stable_linux.arm64 }
          - { name: macOS, os: macos-26, platform: macos, arch: universal, godot_zip: macos.universal.zip, godot_bin: Godot.app/Contents/MacOS/Godot }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: project/addons/godot_git/bin

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Download Godot
        shell: bash
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_${{ matrix.godot_zip }}"
          mkdir -p godot && unzip -q godot.zip -d godot
          chmod +x "godot/${{ matrix.godot_bin }}" || true
          echo "GODOT=$PWD/godot/${{ matrix.godot_bin }}" >> "$GITHUB_ENV"

      # The first editor run registers the extension (.godot/extension_list.cfg); scripts run
      # with -s only load extensions that are registered. Not `--import`: in 4.7.2 that crashes
      # on exit when it loads an extension with an editor plugin for the first time.
      - name: Open project in the editor once
        shell: bash
        run: '"$GODOT" --headless -e --path project --quit-after 300'

      # test_lfs.gd skips itself without git-lfs; in CI it must run everywhere.
      - name: Install Git LFS
        shell: bash
        run: |
          if ! git lfs version; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update && sudo apt-get install -y git-lfs
            elif [ "$RUNNER_OS" = macOS ]; then
              brew install git-lfs
            fi
            git lfs version
          fi

      - name: Run tests
        shell: bash
        run: '"$GODOT" --headless --path project -s res://tests/run_tests.gd -- --online'

      # A playground project with the dock and the smoke-test plugin. The first run registers the
      # extension; the second uses the dock and must end with "SMOKE: OK" (a crash never gets there).
      - name: Smoke test the dock
        shell: bash
        run: |
          python tools/make_playground.py "$RUNNER_TEMP/smoke" --smoke
          "$GODOT" --headless -e --path "$RUNNER_TEMP/smoke" --quit-after 300 || true
          "$GODOT" --headless -e --path "$RUNNER_TEMP/smoke" --quit-after 20000 2>&1 | tee smoke.log || true
          grep -q "SMOKE: OK" smoke.log

  package:
    name: Package
    needs: build
    # Pinned so the image doesn't change underneath us; this job only zips files and uploads them.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # For the third-party license files.

      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: project/addons/godot_git/bin
          merge-multiple: true

      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          python tools/package.py --version "$version" --require-all
          echo "ZIP=dist/godot_git-$version.zip" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot_git
          path: ${{ env.ZIP }}
          if-no-files-found: error

  # Only for tags, and only once every platform's tests passed. Makes a draft release; nothing
  # is ever replaced (no --clobber), and publishing the draft by hand makes it immutable.
  release:
    name: Draft release
    needs: [package, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # To create the release.
      id-token: write # To sign the attestations (Sigstore).
      attestations: write # To store them with the repository.
      artifact-metadata: write # For the attestations' storage records.

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: godot_git
          path: dist

      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: addons/godot_git/bin
          merge-multiple: true

      # Paths as they are in a project, so `sha256sum -c SHA256SUMS --ignore-missing` can be run
      # from a project's folder to check an installed copy (from the Asset Store, say) too.
      - name: Checksums
        shell: bash
        run: |
          (cd dist && sha256sum godot_git-*.zip) > SHA256SUMS
          find addons -type f | sort | xargs sha256sum >> SHA256SUMS
          cat SHA256SUMS

      # Signed statements that these exact files were built by this workflow from this commit.
      # Anyone can check one: gh attestation verify <file> --repo <this repository>
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/godot_git-*.zip
            addons/godot_git/bin/windows/*.dll
            addons/godot_git/bin/linux/*.so
            addons/godot_git/bin/macos/*.framework/libgodot_git.*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/godot_git-*.zip SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
