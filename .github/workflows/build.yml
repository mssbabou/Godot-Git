# Builds the editor plugin for every supported platform and packages it as one zip.
# - Every push/PR: build all platforms, upload "godot_git" zip as a workflow artifact.
# - Publishing a GitHub release: same, and the zip is attached to the release.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x86_64, os: windows-2025-vs2026, platform: windows, arch: x86_64 }
          - { name: Windows arm64, os: windows-11-vs2026-arm, platform: windows, arch: arm64 }
          # Oldest available Ubuntu, so the library runs on as many distros (glibc versions) as possible.
          - { name: Linux x86_64, os: ubuntu-22.04, platform: linux, arch: x86_64 }
          - { name: Linux arm64, os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { name: macOS universal, os: macos-26, platform: macos, arch: universal }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons

      # Cache key follows the submodule commits and the libgit2 build script, so bumping
      # libgit2/godot-cpp or changing its build options starts from a clean cache.
      - name: Compute cache key
        id: cache-key
        shell: bash
        run: echo "deps=$(git submodule status | sha1sum | cut -c1-12)-${{ hashFiles('tools/libgit2.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            .scons-cache
            build/libgit2
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.cache-key.outputs.deps }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.cache-key.outputs.deps }}-

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=editor -j4

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            project/addons/godot_git/bin/
            !project/addons/godot_git/bin/**/*.lib
            !project/addons/godot_git/bin/**/*.exp
            !project/addons/godot_git/bin/**/*.pdb
          if-no-files-found: error

  # Runs project/tests (the GitRepository suites) with the official Godot, headless, against each
  # platform's freshly built library. Covers the backend only; the dock UI isn't tested here.
  test:
    name: Test ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x86_64, os: windows-2025-vs2026, platform: windows, arch: x86_64, godot_zip: win64.exe.zip, godot_bin: Godot_v4.7.2-stable_win64_console.exe }
          - { name: Linux x86_64, os: ubuntu-22.04, platform: linux, arch: x86_64, godot_zip: linux.x86_64.zip, godot_bin: Godot_v4.7.2-stable_linux.x86_64 }
          - { name: Linux arm64, os: ubuntu-22.04-arm, platform: linux, arch: arm64, godot_zip: linux.arm64.zip, godot_bin: Godot_v4.7.2-stable_linux.arm64 }
          - { name: macOS, os: macos-26, platform: macos, arch: universal, godot_zip: macos.universal.zip, godot_bin: Godot.app/Contents/MacOS/Godot }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download library
        uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: project/addons/godot_git/bin

      - name: Download Godot
        shell: bash
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_${{ matrix.godot_zip }}"
          mkdir -p godot && unzip -q godot.zip -d godot
          chmod +x "godot/${{ matrix.godot_bin }}" || true
          echo "GODOT=$PWD/godot/${{ matrix.godot_bin }}" >> "$GITHUB_ENV"

      # The first editor run registers the extension (.godot/extension_list.cfg); scripts run
      # with -s only load extensions that are registered. Not `--import`: in 4.7.2 that crashes
      # on exit when it loads an extension with an editor plugin for the first time.
      - name: Open project in the editor once
        shell: bash
        run: '"$GODOT" --headless -e --path project --quit-after 300'

      - name: Run tests
        shell: bash
        run: '"$GODOT" --headless --path project -s res://tests/run_tests.gd -- --online'

  package:
    name: Package
    needs: build
    # Pinned so the image doesn't change underneath us; this job only zips files and uploads them.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # To attach the zip to a release.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive # For the third-party license files.

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: project/addons/godot_git/bin
          merge-multiple: true

      - name: Package
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          python tools/package.py --version "$version" --require-all
          echo "ZIP=dist/godot_git-$version.zip" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: godot_git
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber
